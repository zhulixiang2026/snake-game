<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🐍 贪吃蛇 · 闯关版</title>
<style>
  /* ===== 这里只管好看，不看也行 ===== */
  body {
    margin: 0;
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 24px;
  }
  h1 { margin: 0 0 8px; font-size: 22px; color: #7bed9f; }
  #bar {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
    font-size: 15px;
  }
  #bar b { color: #ffd32a; }
  canvas {
    background: #0f3460;
    border: 3px solid #7bed9f;
    border-radius: 8px;
  }
  #tip {
    margin-top: 12px;
    font-size: 13px;
    color: #aaa;
    max-width: 420px;
    text-align: center;
    line-height: 1.7;
  }
  button {
    margin-top: 10px;
    padding: 8px 22px;
    font-size: 15px;
    background: #7bed9f;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #1a1a2e;
    font-weight: bold;
  }
  button:hover { background: #5cd37f; }
/* ===== 手机触控区 ===== */
#pad {
  margin-top: 16px;
  display: none;              /* 电脑上先藏着，手机才显示 */
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
#pad .mid { display: flex; gap: 8px; }
#pad .dir {
  width: 64px; height: 64px;
  font-size: 28px;
  border-radius: 50%;
  border: 2px solid #7bed9f;
  background: #16213e;
  color: #7bed9f;
}
#pad .dir:active { background: #7bed9f; color: #1a1a2e; }

/* 屏幕窄（手机）时才把按键亮出来 */
@media (max-width: 520px) {
  #pad { display: flex; }
  canvas { width: 92vw; height: 92vw; }
}
</style>
</head>
<body>
  <h1>🐍 贪吃蛇 · 闯关版</h1>
  <div id="bar">
    分数：<b id="score">0</b>
    &nbsp;|&nbsp; 关卡：<b id="level">1</b>
    &nbsp;|&nbsp; 最高：<b id="best">0</b>
  </div>
  <!-- 游戏画布：20 格 × 20 格，每格 20 像素 -->
  <canvas id="game" width="400" height="400"></canvas>
  <button onclick="startGame()">▶ 开始 / 重新开始</button>
<!-- 手机方向键 -->
<div id="pad">
  <button class="dir" id="btnUp">⬆</button>
  <div class="mid">
    <button class="dir" id="btnLeft">⬅</button>
    <button class="dir" id="btnDown">⬇</button>
    <button class="dir" id="btnRight">➡</button>
  </div>
</div>
  <div id="tip">
    ↑ ↓ ← → 控制方向　·　每关吃到 <b>5 分</b> 过关，速度会越来越快<br>
    撞墙 / 撞自己 / 撞灰色的障碍 = 凉凉 💀
  </div>

<script>
/* ============================================================
   下面才是真正的游戏逻辑，一句一句给你讲
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const SIZE = 20;          // 每一格的边长（像素）
const COLS = canvas.width / SIZE;   // 横向 20 格
const ROWS = canvas.height / SIZE;  // 纵向 20 格

let snake, dir, nextDir, food, obstacles = [], score, level, timer, running;

// 每关需要多少分才能过关
const TARGET = 5;

// 从浏览器本地存档读最高分（关掉网页也不会丢）
let best = parseInt(localStorage.getItem("snakeBest")) || 0;
document.getElementById("best").textContent = best;

/** 一局开始：把所有东西复位 */
function startGame() {
  // 蛇：一个数组，每个元素是 {x, y}。一开始 3 节，朝右
  snake = [
    { x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }
  ];
  dir = { x: 1, y: 0 };     // 当前方向：往右
  nextDir = { x: 1, y: 0 }; // 下一帧要转的方向（防止你一帧里按两次拐弯穿自己）
  score = 0;
  level = 1;
  running = true;
  document.getElementById("score").textContent = score;
  document.getElementById("level").textContent = level;

  placeFood();     // 放第一颗食物
  obstacles = [];  // 第 1 关没障碍

  clearInterval(timer);          // 清掉上一局的计时器
  // 每 150 毫秒刷一帧（数字越小越快）
  timer = setInterval(tick, 150);
}

/** 随机放一颗食物，不能落在蛇身上、也不能落在障碍上 */
function placeFood() {
  let ok;
  do {
    ok = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (
    snake.some(s => s.x === ok.x && s.y === ok.y) ||
    obstacles.some(o => o.x === ok.x && o.y === ok.y)
  );
  food = ok;
}

/** 每一帧干嘛：这是整个游戏的心脏 */
function tick() {
  if (!running) return;

  dir = nextDir;   // 应用这一帧的方向

  // 算出新蛇头（Java 里就是 snake.get(0).x + dir.x）
  const head = {
    x: snake[0].x + dir.x,
    y: snake[0].y + dir.y
  };

  // ===== 死亡判定 =====
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  const hitObs  = obstacles.some(o => o.x === head.x && o.y === head.y);
  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;

  if (hitSelf || hitObs || hitWall) {
    gameOver();
    return;
  }

  snake.unshift(head);   // 蛇头插到最前面（Java: snake.add(0, head)）

  // ===== 吃到食物 =====
  if (head.x === food.x && head.y === food.y) {
    score++;
    document.getElementById("score").textContent = score;
    placeFood();

    // 够分了 → 过关！
    if (score % TARGET === 0) {
      level++;
      document.getElementById("level").textContent = level;
      buildObstacles();          // 生成这一关的障碍
      clearInterval(timer);
      timer = setInterval(tick, Math.max(60, 150 - level * 15)); // 越往后越快，最快 60ms
    }
  } else {
    snake.pop();   // 没吃到，尾巴砍一节 → 蛇长度不变（经典贪吃蛇逻辑）
  }

  draw();
}

/** 生成障碍：第 N 关放 N*2 个灰色砖块 */
function buildObstacles() {
  obstacles = [];
  const count = level * 2;
  const safe = { x: snake[0].x, y: snake[0].y }; // 蛇头位置
  for (let i = 0; i < count; i++) {
    let o;
    do {
      o = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    // 离蛇头至少隔 4 格，绝不卡死
    } while (Math.abs(o.x - safe.x) < 4 && Math.abs(o.y - safe.y) < 4);
    obstacles.push(o);
  }
}

/** 画一帧：先清屏，再画蛇、食物、障碍 */
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 食物（红点）
  ctx.fillStyle = "#ff6b6b";
  ctx.beginPath();
  ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
  ctx.fill();

  // 障碍（灰色砖）
  ctx.fillStyle = "#576574";
  obstacles.forEach(o => ctx.fillRect(o.x * SIZE + 1, o.y * SIZE + 1, SIZE - 2, SIZE - 2));

  // 蛇：头深绿，身体浅绿
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#ffd32a" : (i % 2 === 0 ? "#7bed9f" : "#2ed573");
    ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
  });
}

/** 游戏结束 */
function gameOver() {
  running = false;
  clearInterval(timer);
  if (score > best) {
    best = score;
    localStorage.setItem("snakeBest", best);
    document.getElementById("best").textContent = best;
  }
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#ffd32a";
  ctx.font = "28px Microsoft YaHei";
  ctx.textAlign = "center";
  ctx.fillText("💀 凉凉了", 200, 180);
  ctx.font = "16px Microsoft YaHei";
  ctx.fillStyle = "#fff";
  ctx.fillText("得分 " + score + "　点下面按钮再来一局", 200, 215);
  ctx.textAlign = "left";
}

/* ===== 手机：滑动控制 + 方向按钮 ===== */
let touchStartX = 0, touchStartY = 0;
const canvasEl = document.getElementById("game");

canvasEl.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

canvasEl.addEventListener("touchmove", e => {
  // 滑的时候不让页面跟着滚，手感才顺
  e.preventDefault();
}, { passive: false });

canvasEl.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return; // 滑太短当没滑

  // 看谁滑得更多：横着滑走左右，竖着滑走上下
  if (Math.abs(dx) > Math.abs(dy)) {
    if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };  // 右
    if (dx < 0 && dir.x !== 1)  nextDir = { x: -1, y: 0 }; // 左
  } else {
    if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };  // 下
    if (dy < 0 && dir.y !== 1)  nextDir = { x: 0, y: -1 }; // 上
  }
}, { passive: true });

// 四个方向按钮
function bindBtn(id, nd) {
  const b = document.getElementById(id);
  if (!b) return;
  b.addEventListener("click", e => {
    e.preventDefault();
    // 同样禁止 180° 回头
    if (nd.x !== -dir.x || nd.y !== -dir.y) nextDir = nd;
  });
}
bindBtn("btnUp",    { x: 0, y: -1 });
bindBtn("btnDown",  { x: 0, y: 1 });
bindBtn("btnLeft",  { x: -1, y: 0 });
bindBtn("btnRight", { x: 1, y: 0 });
/* ===== 键盘控制：禁止 180° 急转弯 ===== */

document.addEventListener("keydown", e => {
  const key = e.key;
  if (key === "ArrowUp"    && dir.y !== 1)  nextDir = { x: 0, y: -1 };
  if (key === "ArrowDown"  && dir.y !== -1) nextDir = { x: 0, y: 1 };
  if (key === "ArrowLeft"  && dir.x !== 1)  nextDir = { x: -1, y: 0 };
  if (key === "ArrowRight" && dir.x !== -1) nextDir = { x: 1, y: 0 };
});
</script>
</body>
</html>
